[package]
name = "sourcelens"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sourcelens"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "fs", "net"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
rusqlite = { version = "0.42", features = ["bundled"] }
sqlite-vec = "0.1.9"
ring = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
flate2 = "1"
tar = "0.4"
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
